# Codecov configuration for kern.
#
# Baseline (measured 2026-10-28 at d493ef19 with the exact CI command
# `go test -short -timeout 10m -coverprofile=coverage.out -covermode=atomic
# ./...` + `go tool cover -func`): 71.33% statement coverage
# (56,550 / 79,277) across all packages.
#
# Two layers, deliberately:
# - `scripts/cover-floor.sh` is the ENFORCEABLE aggregate floor (>=68%) and
#   runs inside ci-ok. Codecov's project status is advisory: the upload has
#   fail_ci_if_error: false and the status is not part of ci-ok.
# - the project status below mirrors that floor for the report; patch is a
#   real gate (informational: false) for hosts that require the Codecov
#   status, but ci-ok does not depend on it.
#
# - project: target 68%, threshold 2% — a few points under the measured
#   baseline. Deleting a large package's tests (internal/index = 6.2% of
#   statements; app+mcp = 4.7%) trips it.
# - patch: target 75%, threshold 2%. The previous `informational: true` let a
#   PR ship arbitrary new code with zero tests.
# - changes: disabled. The head-vs-base delta check is flaky and adds noise;
#   project + patch already cover the meaningful regressions.

coverage:
  status:
    project:
      target: 68%
      threshold: 2%
    patch:
      target: 75%
      threshold: 2%
    changes: false