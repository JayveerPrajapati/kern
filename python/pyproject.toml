[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kern-context"
version = "0.4.0"
description = "Local-only context optimizer for AI agents. pip shim: downloads the prebuilt Go binary on first use."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Kern contributors" }]
keywords = ["llm", "context", "compression", "mcp", "agent", "tokens"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]

[project.urls]
Homepage = "https://github.com/JayveerPrajapati/kern"

[project.scripts]
kern = "kern._bootstrap:main"

[tool.setuptools]
packages = ["kern"]
