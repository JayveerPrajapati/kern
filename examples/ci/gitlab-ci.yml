# GitLab CI template for kern code-intelligence and firewall verification.
#
# Usage:
#   include:
#     - remote: 'https://raw.githubusercontent.com/JayveerPrajapati/kern/main/examples/ci/gitlab-ci.yml'
#
# Or copy the job into your .gitlab-ci.yml:

kern:check:
  stage: test
  image: alpine:latest
  variables:
    KERN_VERSION: "latest"
  before_script:
    - apk add --no-cache curl tar gzip git
    - |
      if [ "$KERN_VERSION" = "latest" ]; then
        curl -fsSL https://raw.githubusercontent.com/JayveerPrajapati/kern/main/install.sh | sh
      else
        KERN_VERSION="$KERN_VERSION" curl -fsSL https://raw.githubusercontent.com/JayveerPrajapati/kern/main/install.sh | sh
      fi
    - export PATH="$HOME/.local/bin:$PATH"
  script:
    - kern version
    - kern check --ci
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
