name: kern-check
description: >
  Runs kern change-firewall verification (kern check --ci) to validate boundary
  rules, blast radius, risk thresholds, and security invariants in CI.

inputs:
  version:
    description: kern release tag to install (e.g. v0.9.9.1); default 'latest'.
    required: false
    default: latest
  args:
    description: Additional flags passed to kern check (default '--ci').
    required: false
    default: --ci
  kern-bin:
    description: Existing path to kern binary if already installed.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Run kern check
      uses: ./
      with:
        version: ${{ inputs.version }}
        command: check
        args: ${{ inputs.args }}
        kern-bin: ${{ inputs.kern-bin }}
