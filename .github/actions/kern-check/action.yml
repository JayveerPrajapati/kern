name: kern-check
description: >
  Runs kern governance verification (kern verify) to validate security and
  architecture invariants in CI.

inputs:
  version:
    description: kern release tag to install (e.g. v0.9.9.1); default 'latest'.
    required: false
    default: latest
  args:
    description: Additional flags passed to kern verify (default '--types security,architecture').
    required: false
    default: --types security,architecture
  kern-bin:
    description: Existing path to kern binary if already installed.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Run kern verify
      uses: ./
      with:
        version: ${{ inputs.version }}
        command: verify
        args: ${{ inputs.args }}
        kern-bin: ${{ inputs.kern-bin }}
