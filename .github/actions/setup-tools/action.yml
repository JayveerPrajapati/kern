name: Setup CI Tools
description: >-
  Installs and verifies the kern binary used across CI workflows (built from
  this checkout via `go install ./cmd/kern`). Formerly also installed
  gitleaks and jscpd; both were removed 2026-10-25 after a live audit found
  nothing consumes them — the secret scan is kern's own pure-Go secscan
  (internal/secscan) and the duplication check is pure-Go too
  (internal/duplication), so no external binaries are needed by any job.
inputs:
  install-kern:
    description: Whether to build and install the kern binary
    default: "true"
runs:
  using: composite
  steps:
    - name: Install kern
      if: inputs.install-kern == 'true'
      shell: bash
      run: |
        go install ./cmd/kern
        sudo cp "$(go env GOPATH)/bin/kern" /usr/local/bin/kern || true
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
    - name: Verify tool availability
      shell: bash
      run: |
        which kern && kern version
        kern verify --help >/dev/null 2>&1 || true
        kern guard --help >/dev/null 2>&1 || true
