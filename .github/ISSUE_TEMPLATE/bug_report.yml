name: Bug report
description: Report a bug to help us improve kern
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible so we can reproduce and fix the issue.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Go version, kern version (`kern version`), and any relevant shell/tool versions.
      placeholder: "e.g. macOS 14.4, Go 1.24, kern v0.14.0"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: "Tell us what you expected to happen."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened instead?
      placeholder: "Tell us what actually happened."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Run `kern ...`
        2. ...
        3. See the error
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any logs, screenshots, or other information that might help diagnose the issue.
    validations:
      required: false