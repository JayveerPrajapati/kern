name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # Reusable workflow (test.yml has `on: workflow_call`). A workflow .yml can
    # ONLY be referenced at job level — a step-level `uses:` of it fails on
    # GitHub with "unable to resolve action". Caller jobs support only
    # needs/if/permissions/strategy/concurrency/uses/with/secrets — no
    # runs-on/steps/timeout-minutes (the 30m timeout lives inside test.yml).
    uses: ./.github/workflows/test.yml
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --timeout=10m

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/setup-tools
      - name: Run tests with coverage
        run: go test -short -timeout 10m -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
  # A2: full (non-short) E2E gate. The primary `test` job runs -short, which
  # skips ~25 test functions (the 20-step vertical slice, acceptance matrix,
  # replay/resume, 3/4 cicd governance-gate tests, all MCP
  # interface-consistency tests) — the exact mechanism that let the
  # VersionAtLeast bug ship unnoticed. This job runs those suites for real,
  # with the kern binary built from this checkout and KERN_REQUIRE_BINARY=1
  # so any test that would skip on a missing binary FAILS instead of
  # silently passing.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/setup-tools
      - name: Build kern from checkout
        run: go build -buildvcs=false -o "$RUNNER_TEMP/kern" ./cmd/kern
      - name: Full E2E suite (non-short) — app, cicd, mcp
        run: go test -p 2 -timeout 30m ./internal/app/... ./internal/cicd/... ./internal/mcp/...
        env:
          KERN_BINARY: ${{ runner.temp }}/kern
          KERN_REQUIRE_BINARY: "1"
      - name: Full blueprint suite (non-short)
        run: go test -p 2 -timeout 30m ./internal/blueprint/...
        env:
          KERN_BINARY: ${{ runner.temp }}/kern
          KERN_REQUIRE_BINARY: "1"
