name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # Reusable workflow (test.yml has `on: workflow_call`). A workflow .yml can
    # ONLY be referenced at job level. Runs unit tests with coverage, tags tests,
    # race detector, parity gates, and release archive layout verification.
    uses: ./.github/workflows/test.yml

  lint-and-vuln:
    name: Lint & Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --timeout=10m
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  # A2: full (non-short) E2E gate. The primary `test` job runs -short, which
  # skips ~25 test functions (the 20-step vertical slice, acceptance matrix,
  # replay/resume, 3/4 cicd governance-gate tests, all MCP
  # interface-consistency tests). This job runs those suites for real,
  # with the kern binary built from this checkout and KERN_REQUIRE_BINARY=1.
  e2e:
    name: Full E2E & Blueprint Gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/setup-tools
      - name: Build kern from checkout
        run: go build -buildvcs=false -o "$RUNNER_TEMP/kern" ./cmd/kern
      - name: Full E2E suite (non-short) — app, mcp
        run: go test -p 1 -timeout 30m ./internal/app/... ./internal/mcp/...
        env:
          KERN_BINARY: ${{ runner.temp }}/kern
          KERN_REQUIRE_BINARY: "1"
      - name: Full blueprint suite (non-short)
        run: go test -p 1 -timeout 30m ./internal/blueprint/...
        env:
          KERN_BINARY: ${{ runner.temp }}/kern
          KERN_REQUIRE_BINARY: "1"
      - name: Full E2E suite (non-short) — loop, verification
        run: go test -p 2 -timeout 30m ./internal/loop/... ./internal/verification/...
        env:
          KERN_BINARY: ${{ runner.temp }}/kern
          KERN_REQUIRE_BINARY: "1"
