name: pr-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history is required: the review action diffs against the base ref.
      - uses: ./.github/actions/bootstrap
        with:
          fetch-depth: "0"

      # Shared quality gate: vet + gofmt + short test suite.
      - uses: ./.github/actions/quality

      - name: Build kern from checkout
        run: go build -buildvcs=false -o "$RUNNER_TEMP/kern" ./cmd/kern

      - uses: ./.github/actions/kern-review
        with:
          base-ref: origin/${{ github.base_ref }}
          kern-bin: ${{ runner.temp }}/kern
          comment: "true"
          fail-on-risk: "false"
