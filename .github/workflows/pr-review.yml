name: pr-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The action diffs against the base ref, so full history is required.
          fetch-depth: 0

      # The gate is the same reusable action consumers import — this repo
      # dogfoods it. `kern-bin` points at a binary built from this checkout so
      # PRs that change kern itself are reviewed with the proposed code.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: ./.github/actions/setup-tools

      - name: Vet and test
        run: |
          go vet ./...
          go test -short -timeout 10m ./...

      - name: Build kern from checkout
        run: go build -buildvcs=false -o "$RUNNER_TEMP/kern" ./cmd/kern

      - uses: ./.github/actions/kern-review
        with:
          base-ref: origin/${{ github.base_ref }}
          kern-bin: ${{ runner.temp }}/kern
          comment: "true"
          fail-on-risk: "false"
