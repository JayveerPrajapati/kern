name: KernOps Governed Engineering Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  kernops-gate:
    name: KernOps Firewall & Supply Chain Attestation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
          sudo chmod +x /usr/local/bin/gitleaks

      - name: Set up Node for jscpd
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install jscpd
        run: |
          sudo npm install -g jscpd
          if ! command -v jscpd &> /dev/null; then
            sudo ln -sf "$(npm config get prefix)/bin/jscpd" /usr/local/bin/jscpd
          fi

      - name: Build and Install Kern & KernOps
        run: |
          go build -o /usr/local/bin/kern ./cmd/kern
          go build -o /usr/local/bin/kernops ./cmd/kernops

      - name: Run Governed Change Firewall (Gates G0-G29)
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="HEAD~1"
          fi
          HEAD_SHA="${{ github.sha }}"
          kern ci --base "$BASE_SHA" --head "$HEAD_SHA" --receipt

      - name: Export SARIF Security Report
        if: always()
        run: |
          kern verify-receipt --sarif > kernops-report.sarif

      - name: Export In-Toto v0.2 Supply-Chain Attestation
        if: always()
        run: |
          kern verify-receipt --in-toto > kernops-attestation.json

      - name: Verify Cryptographic Supply Chain & Tamper Integrity
        run: |
          kern verify-receipt --check-diff

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: kernops-report.sarif
        continue-on-error: true

      - name: Archive Compliance Attestation Receipt
        uses: actions/upload-artifact@v4
        with:
          name: kernops-attestation-receipt
          path: |
            kernops-report.sarif
            kernops-attestation.json
            .blueprint/receipts/
