name: KernOps Governed Engineering Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: kernops-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernops-gate:
    name: KernOps Firewall & Supply Chain Attestation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: ./.github/actions/setup-tools

      - name: Build and Install Kern & KernOps
        run: |
          go build -o /usr/local/bin/kern ./cmd/kern
          go build -o /usr/local/bin/kernops ./cmd/kernops

      - name: Run Governed Change Firewall (Gates G0-G29)
        id: firewall
        continue-on-error: true
        env:
          BLUEPRINT_TIMEOUT: 600s
          BLUEPRINT_SANDBOX_TIMEOUT: 600s
          BLUEPRINT_SANDBOX_TEST: "go test -short ./internal/blueprint/receipt/... ./internal/cockpit/... ./internal/loop/..."
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ] || ! git rev-parse --verify "$BASE_SHA" >/dev/null 2>&1; then
            BASE_SHA="HEAD~1"
          fi
          HEAD_SHA="${{ github.sha }}"
          kern ci --base "$BASE_SHA" --head "$HEAD_SHA" --receipt

      - name: Export SARIF Security Report
        if: always()
        run: |
          kern verify-receipt --sarif > kernops-report.sarif

      - name: Export In-Toto v0.2 Supply-Chain Attestation
        if: always()
        run: |
          kern verify-receipt --in-toto > kernops-attestation.json

      - name: Verify Cryptographic Supply Chain & Tamper Integrity
        run: |
          kern verify-receipt --check-diff

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always()
        with:
          sarif_file: kernops-report.sarif
        continue-on-error: true

      - name: Archive Compliance Attestation Receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: kernops-attestation-receipt
          if-no-files-found: warn
          path: |
            kernops-report.sarif
            kernops-attestation.json
            blueprint-result.json
            .blueprint/receipts/
