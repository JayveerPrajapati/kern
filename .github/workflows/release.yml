name: release
on:
  push:
    tags:
      - "v*"
  # Manual dry-run: workflow_dispatch runs the whole test/review/build +
  # build-native (CGO, tree-sitter `-full`) matrix against any ref WITHOUT
  # publishing. The `release` (publish) job is gated on
  # github.event_name == 'push', so a dispatched run validates the native
  # matrix — which otherwise only ever runs on a real tag push — before a
  # tag ships.

# Least privilege: only the publish job needs to write.
permissions:
  contents: read
# The single pinned Go toolchain every job runs under (same value as ci.yml —
# the patched stdlib the release binaries must carry). go.mod's `go` directive
# stays the language-version floor (1.27.0); GOTOOLCHAIN is auto-downloaded
# and used for the matrix builds. Declared once here so bumping the toolchain
# touches one place.
env:
  GOTOOLCHAIN: go1.27.2

# Never cancel a release that is mid-publish: a second tag push would leave a
# half-uploaded release behind.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changelog:
    name: changelog entry exists for tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GOTOOLCHAIN comes from the workflow-level env (the patched stdlib
    # release binaries must carry — see the top of this file).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Changelog entry exists for tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dry-run (workflow_dispatch): changelog gate skipped — no tag to check"
            exit 0
          fi
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          if ! grep -qF "## [${version}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}]' section for tag ${tag} — add one (Keep a Changelog) before releasing."
            exit 1
          fi
  test:
    # Reusable workflow (test.yml has `on: workflow_call`). A workflow .yml
    # can ONLY be referenced at job level — a step-level `uses:` of it fails
    # on GitHub with "unable to resolve action". Caller jobs support only
    # needs/if/permissions/strategy/concurrency/uses/with/secrets — no
    # runs-on/steps/timeout-minutes (the 30m timeout lives inside test.yml).
    name: vet + test
    uses: ./.github/workflows/test.yml
  review:
    name: kern code review
    needs: [test, changelog]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history: the review action diffs the release tag against
      # origin/main. No module cache: the tree was just built by the test
      # workflow's jobs.
      - uses: ./.github/actions/go-env
        with:
          fetch-depth: 0
          cache: false

      - name: Build kern from checkout
        run: |
          go build -buildvcs=false -o "$RUNNER_TEMP/kern" ./cmd/kern

      # Run the kern-review action on the release tag so a release is reviewed
      # against main before it ships (no workflow runs it on PRs today).
      # `comment` is disabled because a tag push has no pull request to comment
      # on; the review + risk + boundary-guard analysis still runs and the
      # verdict is surfaced in the job summary.
      - uses: ./.github/actions/kern-review
        with:
          base-ref: origin/main
          kern-bin: ${{ runner.temp }}/kern
          comment: "false"
          fail-on-risk: "false"

  build:
    name: build ${{ matrix.target }}
    needs: [test, changelog, review]
    strategy:
      matrix:
        target:
          - linux/amd64
          - linux/arm64
          - darwin/amd64
          - darwin/arm64
          - windows/amd64
          - windows/arm64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: ./.github/actions/go-env
      - uses: ./.github/actions/release-assets
        with:
          target: ${{ matrix.target }}

  # Native, CGO-enabled build matrix producing the tree-sitter-enabled
  # `-full` assets. Tree-sitter grammars are hard-CGO, so they can only be
  # compiled on a runner whose GOOS/GOARCH matches the target — the reason
  # the cross-compiled `build` job above ships the pure-Go
  # `-tags sqlite,notreesitter` build. Every target here runs on a native
  # runner; windows-arm64 has no native runner yet and stays pure-Go only
  # (no `-full` asset). The build mirrors the `build` job minus the pure-Go
  # tags: same -trimpath + ldflags stamping, same two binaries, same
  # linux-only UPX policy. Installers probe for these assets FIRST and fall
  # back to the pure-Go build when a `-full` asset is missing.
  build-native:
    name: build-native ${{ matrix.target }}
    needs: [test, changelog, review]
    strategy:
      matrix:
        include:
          - target: linux/amd64
            runner: ubuntu-latest
          - target: linux/arm64
            runner: ubuntu-24.04-arm
          - target: darwin/amd64
            # macos-13 (the old Intel runner) is retired; macos-15-intel is
            # its native replacement.
            runner: macos-15-intel
          - target: darwin/arm64
            runner: macos-15
          - target: windows/amd64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # Release binaries must carry the patched stdlib (see lint-and-vuln in
    # ci.yml): GOTOOLCHAIN is auto-downloaded and used for the matrix builds.
    env:
      GOTOOLCHAIN: go1.27.2
    steps:
      - uses: ./.github/actions/go-env
      - uses: ./.github/actions/release-assets
        with:
          target: ${{ matrix.target }}
          suffix: "-full"
          cgo: "1"
          tags: ""
          native: "true"

  release:
    name: publish release
    # Gate: only a real tag push publishes. A workflow_dispatch run exists to
    # dry-run the test/review/build/build-native matrix against any ref and
    # must never create a release.
    if: github.event_name == 'push'
    needs: [build, build-native]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      # Optional GPG signing secrets (see docs/security/signed-releases.md).
      # When GPG_PRIVATE_KEY is unset every signing step below is skipped and
      # the release ships SHA256SUMS-only (checksum integrity, no authenticity).
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      # Job-level so `if: env.TAP_PUBLISH_TOKEN != ''` below can see it: a
      # step's own `env:` is not visible to that step's `if:`, and `secrets`
      # is not allowed in `if:` at all.
      TAP_PUBLISH_TOKEN: ${{ secrets.TAP_PUBLISH_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums and brew formula
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # The source archive Homebrew will build from; its sha256 goes in the formula.
          curl -fsSL "https://github.com/${{ github.repository }}/archive/refs/tags/${tag}.tar.gz" -o source.tar.gz
          sha="$(sha256sum source.tar.gz | awk '{print $1}')"
          echo "source sha256: ${sha}"
          # One SHA256SUMS for every prebuilt asset (relative names, so
          # 'sha256sum -c SHA256SUMS' works from a download directory).
          (cd dist && sha256sum kern-*.tar.gz kern-*.zip) > dist/SHA256SUMS
          # Ready-to-use Homebrew formula: url + sha256 filled in for this tag.
          sed -e "s|__KERN_VERSION__|${tag}|g" \
              -e "s|__KERN_SHA256__|${sha}|" \
              -e "s|JayveerPrajapati/kern|${{ github.repository }}|g" \
              homebrew/kern.rb > kern.rb
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      # Post-packaging release smoke (B3): verifies what users download —
      # SHA256SUMS round-trip, binary stamps, a live MCP stdio handshake
      # (32 tool surfaces), index+search on this checkout, and doctor
      # with zero [fail] findings — against the real release archives, not
      # the development binary. Runs on every real tag push (the job is
      # gated on push), before the release is published.
      - name: Release smoke (artifacts)
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          scripts/release-smoke.sh --dir dist --repo . --version "$tag"

      # --- GPG signing (optional but recommended) ---------------------------
      # Signs SHA256SUMS and every release binary with the project's GPG key.
      # Entirely optional: if the GPG_PRIVATE_KEY secret is not configured the
      # steps below are skipped and the release is published unsigned (SHA256
      # checksums still apply). Key generation + secret setup are documented
      # in docs/security/signed-releases.md.
      - name: Sign release assets with GPG (optional)
        id: sign
        if: ${{ env.GPG_PRIVATE_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          # Import the base64-encoded private key into the ephemeral keyring.
          echo "${GPG_PRIVATE_KEY}" | base64 --decode | gpg --batch --yes --import
          # Resolve the fingerprint of the primary secret key.
          fp="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')"
          echo "signing with key ${fp}"
          # Export the public key so users can verify without a keyserver.
          gpg --batch --yes --armor --export "${fp}" > dist/SHA256SUMS.asc
          # Detached, armored signature over the checksums file (covers every
          # binary plus the source archive hash).
          gpg --batch --yes --pinentry-mode loopback --passphrase "${GPG_PASSPHRASE}" \
            --armor --detach-sign --output dist/SHA256SUMS.sig dist/SHA256SUMS
          # And a signature per binary asset.
          for f in dist/kern-*.tar.gz dist/kern-*.zip; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "${GPG_PASSPHRASE}" \
              --armor --detach-sign --output "${f}.sig" "${f}"
          done
          echo "signed=true" >> "$GITHUB_OUTPUT"
      # Self-check: re-verify every signature we just produced before it ships.
      # A failed verification fails the job, so a broken signature can never be
      # uploaded to the release.
      - name: Verify GPG signatures (optional)
        if: ${{ env.GPG_PRIVATE_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          gpg --batch --verify dist/SHA256SUMS.sig dist/SHA256SUMS
          for f in dist/kern-*.tar.gz dist/kern-*.zip; do
            gpg --batch --verify "${f}.sig" "${f}"
          done
          echo "all release signatures verified"
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          tag="$TAG"
          version="${tag#v}"
          # Release notes come from the CHANGELOG entry for this tag (the test
          # job above already failed the run if the section is missing), so the
          # notes never drift from the changelog. A compact install blurb is
          # prepended; it is shared with the README's install options.
          # Using index() (string match, not regex) so the tag "0.9.5" matches
          # the "## [0.9.5] - date" header no matter how "[" is interpreted.
          # Printing stops at the next "## " section header (single source of
          # truth: the CHANGELOG).
          {
            echo "- \`curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh\`"
            echo "- \`go install github.com/${{ github.repository }}/cmd/kern@$tag\`"
            echo "- Homebrew: a ready-to-import formula is attached as \`kern.rb\` (\`brew install ./kern.rb\`); a \`owner/tap\` formula is auto-published only when the repository has the \`TAP_PUBLISH_TOKEN\` secret configured."
            echo "Assets include a \`SHA256SUMS\` file (\`install.sh\` verifies against it)."
            if [ -n "${GPG_PRIVATE_KEY:-}" ]; then
              echo "- Assets are GPG-signed: \`SHA256SUMS.sig\` (detached signature) + \`SHA256SUMS.asc\` (public key). See \`docs/security/signed-releases.md\`."
            fi
            awk -v ver="[$version]" '
              /^## / {
                if (f) exit;
                if (index($0, ver)==4) { f=1; next }
              }
              f { print }
            ' CHANGELOG.md
          } > /tmp/release-notes.md
          gh release create "$tag" dist/kern-*.tar.gz dist/kern-*.zip dist/SHA256SUMS kern.rb \
            --notes-file /tmp/release-notes.md \
            --draft=false

      # Attach the signatures + public key. This MUST come after the release is
      # created: `gh release upload` fails on a tag with no release yet. Runs
      # only when signing happened (the sign step set signed=true).
      - name: Upload GPG signatures to release (optional)
        if: ${{ steps.sign.outputs.signed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            dist/SHA256SUMS.sig dist/SHA256SUMS.asc dist/kern-*.sig \
            --clobber

      # Auto-publish the Homebrew formula to the tap repo so `brew tap <owner>/tap
      # && brew install kern` works for every released tag WITHOUT running
      # publish-tap.sh by hand. The tap repo (github.com/<owner>/homebrew-tap)
      # must exist once (created via `scripts/publish-tap.sh` or manually); after
      # that this step updates Formula/kern.rb on each tag push.
      # Requires a PAT with `repo` scope (GITHUB_TOKEN cannot push to another
      # repo) stored as the `TAP_PUBLISH_TOKEN` repository secret. The tap owner
      # defaults to the repo owner; override with the `TAP_OWNER` repo variable.
      # continue-on-error: the GitHub release itself is already created above;
      # a tap sync failure (missing secret, tap repo not bootstrapped, push
      # rejected) must never fail the release run.
      - name: Publish Homebrew tap (best-effort, never blocks the release)
        if: ${{ env.TAP_PUBLISH_TOKEN != '' }}
        continue-on-error: true
        env:
          TAP_TOKEN: ${{ secrets.TAP_PUBLISH_TOKEN }}
          TAP_OWNER: ${{ vars.TAP_OWNER }}
          TAG: ${{ steps.release.outputs.tag }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          tag="$TAG"
          owner="${TAP_OWNER:-$REPO_OWNER}"
          echo "==> publishing kern ${tag} to tap ${owner}/homebrew-tap"
          git clone "https://${TAP_TOKEN}@github.com/${owner}/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp kern.rb tap/Formula/kern.rb
          git -C tap add Formula/kern.rb
          if git -C tap diff --cached --quiet; then
            echo "==> formula unchanged, nothing to push"
            exit 0
          fi
          git -C tap -c "user.name=${owner}" -c "user.email=${owner}@users.noreply.github.com" \
            commit -m "kern ${tag}: update formula"
          git -C tap push origin HEAD:master
          echo "==> done: brew tap ${owner}/tap && brew install kern"
