name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

  build:
    name: build ${{ matrix.target }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - linux/amd64
          - linux/arm64
          - darwin/amd64
          - darwin/arm64
          - windows/amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set target variables
        id: vars
        shell: bash
        run: |
          os="${MATRIX_TARGET%/*}"
          arch="${MATRIX_TARGET#*/}"
          tag="${GITHUB_REF#refs/tags/}"
          echo "os=$os" >> "$GITHUB_OUTPUT"
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "dir=kern-$os-$arch" >> "$GITHUB_OUTPUT"
        env:
          MATRIX_TARGET: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          os="${{ steps.vars.outputs.os }}"
          arch="${{ steps.vars.outputs.arch }}"
          dir="${{ steps.vars.outputs.dir }}"
          mkdir -p "$dir"
          GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
            go build -buildvcs=false -ldflags "-X main.version=${{ steps.vars.outputs.tag }}" \
            -o "$dir/kern" ./cmd/kern
          GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
            go build -buildvcs=false -ldflags "-X main.version=${{ steps.vars.outputs.tag }}" \
            -o "$dir/kern-mcp" ./cmd/kern-mcp

      - name: Package (tar.gz, or zip for windows)
        shell: bash
        run: |
          os="${{ steps.vars.outputs.os }}"
          arch="${{ steps.vars.outputs.arch }}"
          dir="${{ steps.vars.outputs.dir }}"
          if [ "$os" = "windows" ]; then
            mv "$dir/kern" "$dir/kern.exe"
            mv "$dir/kern-mcp" "$dir/kern-mcp.exe"
            zip -q -r "kern-$os-$arch.zip" "$dir"
          else
            tar -czf "kern-$os-$arch.tar.gz" "$dir"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: "kern-${{ steps.vars.outputs.os }}-${{ steps.vars.outputs.arch }}"
          path: |
            kern-*.tar.gz
            kern-*.zip

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifact subdirectories
        shell: bash
        run: |
          # download-artifact@v4 places each artifact in its own subdir; flatten.
          find dist -mindepth 2 -type f -exec mv -t dist/ {} +

      - name: Generate checksums and brew formula
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          # The source archive Homebrew will build from; its sha256 goes in the formula.
          curl -fsSL "https://github.com/${{ github.repository }}/archive/refs/tags/${tag}.tar.gz" -o source.tar.gz
          sha="$(sha256sum source.tar.gz | awk '{print $1}')"
          echo "source sha256: ${sha}"
          # One SHA256SUMS for every prebuilt asset (relative names, so
          # 'sha256sum -c SHA256SUMS' works from a download directory).
          (cd dist && sha256sum kern-*.tar.gz kern-*.zip) > dist/SHA256SUMS
          # Ready-to-use Homebrew formula: url + sha256 filled in for this tag.
          sed -e "s|v0.1.0|${tag}|g" \
              -e "s|REPLACE_WITH_SOURCE_TARBALL_SHA256|${sha}|" \
              homebrew/kern.rb > kern.rb
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          cat > /tmp/release-notes.md <<EOF
          See [README](https://github.com/${{ github.repository }}/blob/main/README.md) for install options:
          - \`curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh\`
          - \`go install github.com/${{ github.repository }}/cmd/kern@$tag\`
          - \`brew install kern\` — ready-to-use formula attached as \`kern.rb\`
          - \`pip install kern-context\`

          Assets include a \`SHA256SUMS\` file (\`install.sh\` verifies against it) and
          a filled-in Homebrew formula for the tap repo.
          EOF
          gh release create "$tag" dist/kern-* dist/SHA256SUMS kern.rb \
            --title "$tag" \
            --notes-file /tmp/release-notes.md \
            --draft=false
