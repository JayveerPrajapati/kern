name: release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vet + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Changelog entry exists for tag
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          if ! grep -qF "## [${version}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}]' section for tag ${tag} — add one (Keep a Changelog) before releasing."
            exit 1
          fi

      - uses: ./.github/actions/setup-tools

      - name: Vet and test
        run: |
          go vet ./...
          go test -short -timeout 10m ./...

  review:
    name: kern code review
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The action diffs the release tag against origin/main, so full
          # history is required.
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Build kern from checkout
        run: |
          go build -buildvcs=false -o "$RUNNER_TEMP/kern" ./cmd/kern
          go build -buildvcs=false -o "$RUNNER_TEMP/kern-server" ./cmd/kern-server

      # Run the same reusable code-review action on the release tag that runs
      # on PRs, so a release is reviewed against main before it ships. `comment`
      # is disabled because a tag push has no pull request to comment on; the
      # review + risk + boundary-guard analysis still runs and the verdict is
      # surfaced in the job summary.
      - uses: ./.github/actions/kern-review
        with:
          base-ref: origin/main
          kern-bin: ${{ runner.temp }}/kern
          comment: "false"
          fail-on-risk: "false"

  build:
    name: build ${{ matrix.target }}
    needs: [test, review]
    strategy:
      matrix:
        target:
          - linux/amd64
          - linux/arm64
          - darwin/amd64
          - darwin/arm64
          - windows/amd64
          - windows/arm64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set target variables
        id: vars
        shell: bash
        run: |
          MATRIX_TARGET="${{ matrix.target }}"
          os="${MATRIX_TARGET%/*}"
          arch="${MATRIX_TARGET#*/}"
          tag="${GITHUB_REF#refs/tags/}"
          echo "os=$os" >> "$GITHUB_OUTPUT"
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "dir=kern-$os-$arch" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: |
          os="${{ steps.vars.outputs.os }}"
          arch="${{ steps.vars.outputs.arch }}"
          dir="${{ steps.vars.outputs.dir }}"
          mkdir -p "$dir"
          GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
            go build -buildvcs=false -trimpath -tags sqlite -ldflags "-s -w -X main.version=${{ steps.vars.outputs.tag }}" \
            -o "$dir/kern" ./cmd/kern
          GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
            go build -buildvcs=false -trimpath -tags sqlite -ldflags "-s -w" \
            -o "$dir/kern-mcp" ./cmd/kern-mcp
          GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
            go build -buildvcs=false -trimpath -tags sqlite -ldflags "-s -w" \
            -o "$dir/kern-server" ./cmd/kern-server

      # Shrink the binaries with UPX (best compression). Significant savings:
      # the Go runtime + three cmd binaries land ~50% smaller once packed.
      # UPX is skipped for windows (cross-compressing .exe from the linux
      # runner is fragile). The `kern` binary is smoke-tested with its `version`
      # subcommand after compression; the MCP/stdio binaries (kern-mcp,
      # kern-server) are verified structurally with `file` because they read
      # stdin and have no non-interactive `version` subcommand. A broken
      # compression still fails the job before SHA256SUMS is generated.
      - name: Compress binaries with UPX (non-windows)
        if: steps.vars.outputs.os != 'windows'
        shell: bash
        run: |
          sudo apt-get install -y -qq upx-ucl >/dev/null 2>&1 || sudo apt-get install -y -qq upx >/dev/null 2>&1
          dir="${{ steps.vars.outputs.dir }}"
          upx --best --no-lzma "$dir/kern" && "$dir/kern" version >/dev/null
          upx --best --no-lzma "$dir/kern-server" && file "$dir/kern-server" | grep -qi "ELF"
          upx --best --no-lzma "$dir/kern-mcp" && file "$dir/kern-mcp" | grep -qi "ELF"
          echo "compressed sizes:"
          du -h "$dir/kern" "$dir/kern-mcp" "$dir/kern-server"

      - name: Package (tar.gz, or zip for windows)
        shell: bash
        run: |
          os="${{ steps.vars.outputs.os }}"
          dir="${{ steps.vars.outputs.dir }}"
          if [ "$os" = "windows" ]; then
            mv "$dir/kern" "$dir/kern.exe"
            mv "$dir/kern-mcp" "$dir/kern-mcp.exe"
            mv "$dir/kern-server" "$dir/kern-server.exe"
            (cd "$dir" && zip -r "../${dir}.zip" .)
          else
            tar -czf "${dir}.tar.gz" -C "$dir" .
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: "kern-${{ steps.vars.outputs.os }}-${{ steps.vars.outputs.arch }}"
          path: |
            kern-*.tar.gz
            kern-*.zip

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums and brew formula
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # The source archive Homebrew will build from; its sha256 goes in the formula.
          curl -fsSL "https://github.com/${{ github.repository }}/archive/refs/tags/${tag}.tar.gz" -o source.tar.gz
          sha="$(sha256sum source.tar.gz | awk '{print $1}')"
          echo "source sha256: ${sha}"
          # One SHA256SUMS for every prebuilt asset (relative names, so
          # 'sha256sum -c SHA256SUMS' works from a download directory).
          (cd dist && sha256sum kern-*.tar.gz kern-*.zip) > dist/SHA256SUMS
          # Ready-to-use Homebrew formula: url + sha256 filled in for this tag.
          sed -e "s|__KERN_VERSION__|${tag}|g" \
              -e "s|__KERN_SHA256__|${sha}|" \
              homebrew/kern.rb > kern.rb
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.release.outputs.tag }}"
          version="${tag#v}"
          # Release notes come from the CHANGELOG entry for this tag (the test
          # job above already failed the run if the section is missing), so the
          # notes never drift from the changelog. A compact install blurb is
          # prepended; it is shared with the README's install options.
          # Using index() (string match, not regex) so the tag "0.9.5" matches
          # the "## [0.9.5] - date" header no matter how "[" is interpreted.
          # Printing stops at the next "## " section header (single source of
          # truth: the CHANGELOG).
          {
            echo '- `curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh`'
            echo "- \`go install github.com/${{ github.repository }}/cmd/kern@$tag\`"
            echo '- `brew install kern` — from the tap repo (auto-published by this workflow); formula attached as `kern.rb`.'
            echo 'Assets include a `SHA256SUMS` file (`install.sh` verifies against it).'
            awk -v ver="[$version]" '
              /^## / {
                if (f) exit;
                if (index($0, ver)==4) { f=1; next }
              }
              f { print }
            '
          } > /tmp/release-notes.md
          gh release create "$tag" dist/kern-*.tar.gz dist/kern-*.zip dist/SHA256SUMS kern.rb \
            --notes-file /tmp/release-notes.md \
            --draft=false

      # Auto-publish the Homebrew formula to the tap repo so `brew tap <owner>/tap
      # && brew install kern` works for every released tag WITHOUT running
      # publish-tap.sh by hand. The tap repo (github.com/<owner>/homebrew-tap)
      # must exist once (created via `scripts/publish-tap.sh` or manually); after
      # that this step updates Formula/kern.rb on each tag push.
      # Requires a PAT with `repo` scope (GITHUB_TOKEN cannot push to another
      # repo) stored as the `TAP_PUBLISH_TOKEN` repository secret. The tap owner
      # defaults to the repo owner; override with the `TAP_OWNER` repo variable.
      # continue-on-error: the GitHub release itself is already created above;
      # a tap sync failure (missing secret, tap repo not bootstrapped, push
      # rejected) must never fail the release run.
      - name: Publish Homebrew tap (best-effort, never blocks the release)
        if: ${{ env.TAP_PUBLISH_TOKEN != '' }}
        continue-on-error: true
        env:
          TAP_TOKEN: ${{ secrets.TAP_PUBLISH_TOKEN }}
          TAP_OWNER: ${{ vars.TAP_OWNER }}
        run: |
          tag="${{ steps.release.outputs.tag }}"
          owner="${TAP_OWNER:-${{ github.repository_owner }}}"
          echo "==> publishing kern ${tag} to tap ${owner}/homebrew-tap"
          git clone "https://${TAP_TOKEN}@github.com/${owner}/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp kern.rb tap/Formula/kern.rb
          git -C tap add Formula/kern.rb
          if git -C tap diff --cached --quiet; then
            echo "==> formula unchanged, nothing to push"
            exit 0
          fi
          git -C tap -c "user.name=${owner}" -c "user.email=${owner}@users.noreply.github.com" \
            commit -m "kern ${tag}: update formula"
          git -C tap push origin HEAD:master
          echo "==> done: brew tap ${owner}/tap && brew install kern"
