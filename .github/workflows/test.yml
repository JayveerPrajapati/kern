name: test
# Reusable core test workflow, called by ci.yml (every PR/push) and release.yml
# (every tag). Keep this to checks that must pass for BOTH. PR-only extras
# (cross-OS smoke, governance gate) live in ci.yml; live-network checks live in
# nightly-full.yml, so a release is never blocked by someone else's network.
#
# The jobs are independent and run in parallel, so wall-clock time is the
# slowest job instead of the sum of all of them.
on:
  workflow_call:
permissions:
  contents: read
jobs:
  # Cheap static checks: fail in about a minute instead of after the full suite.
  # `go vet` is deliberately not repeated here: ci.yml's golangci-lint runs
  # govet (see .golangci.yml), and `go test` runs its own vet subset.
  checks:
    name: format, install.ps1 parse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: ./.github/actions/go-env
      - name: Format
        run: test -z "$(gofmt -l .)" || { echo "gofmt needed on:"; gofmt -l .; exit 1; }
      - name: Generated docs freshness
        run: |
          go build -buildvcs=false -o "$RUNNER_TEMP/kern" ./cmd/kern
          "$RUNNER_TEMP/kern" gen-catalog --check
          "$RUNNER_TEMP/kern" gen-contracts --check
          "$RUNNER_TEMP/kern" gen-docs --doc schemas --check
          "$RUNNER_TEMP/kern" gen-docs --doc selection --check
          "$RUNNER_TEMP/kern" gen-docs --doc site --check
      # install.ps1 is executed only on the windows runner (ci.yml
      # global-install-smoke); on the ubuntu jobs it is dead weight that a
      # silent PowerShell syntax error would otherwise ship. [scriptblock]::Create
      # parses the whole file without running it, so any future edit that breaks
      # the script's syntax fails CI here, cheaply. pwsh is preinstalled on
      # ubuntu images.
      - name: install.ps1 parse check
        run: |
          pwsh -NoProfile -Command "$null = [scriptblock]::Create((Get-Content install.ps1 -Raw)); 'parse ok'"

  unit:
    name: unit tests (coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: ./.github/actions/go-env
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-tools
      - name: Test (with coverage)
        run: go test -short -timeout 10m -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: coverage.out
          fail_ci_if_error: false

  # Build-tag variants: the same packages under the pure-Go tag sets, plus a
  # compile check of all three binaries under every tag combination.
  tags:
    name: build tags
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: ./.github/actions/go-env
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-tools
      - name: Test (sqlite,notreesitter tags)
        run: CGO_ENABLED=0 go test -tags sqlite,notreesitter ./internal/index/... ./internal/doctor/...
      - name: Test (notreesitter tags)
        run: CGO_ENABLED=0 go test -tags notreesitter ./internal/index/... ./internal/doctor/...
      - name: Build all binaries
        run: |
          go build -buildvcs=false -o "$RUNNER_TEMP/kern" ./cmd/kern
          go build -buildvcs=false -o "$RUNNER_TEMP/kern-mcp" ./cmd/kern-mcp
      - name: Build all binaries (sqlite,notreesitter tags)
        run: |
          CGO_ENABLED=0 go build -buildvcs=false -tags sqlite,notreesitter -o /dev/null ./cmd/kern
          CGO_ENABLED=0 go build -buildvcs=false -tags sqlite,notreesitter -o /dev/null ./cmd/kern-mcp
      - name: Build all binaries (notreesitter tags)
        run: |
          CGO_ENABLED=0 go build -buildvcs=false -tags notreesitter -o /dev/null ./cmd/kern
          CGO_ENABLED=0 go build -buildvcs=false -tags notreesitter -o /dev/null ./cmd/kern-mcp

  # Race detector over the concurrency-sensitive packages (agent registry /
  # in-flight tool / lock lifecycle races, event bus, loop scheduler, symbol
  # index, project store, process groups). Scoped
  # to keep the full -race ./... suite from slowing CI. The -timeout is
  # sized for the race run (roughly 4x slower): internal/app alone is
  # ~3min without -race and exceeds the default 10m cap under
  # instrumentation, and the index suite adds ~4min under -race. The package
  # list is split into two shards that run in parallel (this was one 20m
  # serial step); the union is exactly the previous list. This only adds the
  # -race flag — test parallelism is unchanged, so netns tests (which rely on
  # t.Setenv and must stay serial) are unaffected.
  race:
    name: race detector (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: app-governance
            packages: ./internal/app/... ./internal/governance/...
          - shard: mcp-index-loop-rest
            packages: ./internal/mcp/... ./internal/index/... ./internal/project/... ./internal/loop/... ./internal/eventbus/... ./internal/processgroup/...
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: ./.github/actions/go-env
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-tools
      - name: Test (race detector)
        run: go test -short -race -timeout 20m ${{ matrix.packages }}

  # The contract/parity gates (MCP catalog vs plugin, architecture doc parity,
  # golden routing questions, per-language parity, CLI usage contract) are
  # ordinary tests that run inside `unit`; none skips under -short, so a
  # separate job would only run them a second time.

  # Benchmark regression gate (`kern bench --check`, the `make bench-gate`
  # target). Latency gates are machine-sensitive, so the versioned thresholds
  # in cmd/kern/bench_thresholds.json are deliberately generous (ceilings ~10x
  # over the measured baseline) and only fail on real regressions — the
  # cold-vs-warm speedup floor catches a warm Load falling through to a full
  # Build, the query ceilings catch a wiring regression, and min_results catches
  # a zero-result query. Runs on every PR/push and every release tag (test.yml
  # is reused by release.yml), giving the gate CI enforcement instead of it
  # being a local-only `make` target.
  bench:
    name: bench regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: ./.github/actions/go-env
        with:
          fetch-depth: 0
      - name: Run bench --check
        run: go run ./cmd/kern bench --root . --check

  # Locks the release artifact layout: `make dist` (the same flow the release
  # workflow uses) must produce exactly the archives release.yml uploads, each
  # containing the two binaries, plus a SHA256SUMS that round-trips through
  # sha256sum -c. Guards against silent layout drift (renamed archives or
  # binaries) breaking install.sh and the release pipeline.
  release-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: ./.github/actions/go-env
      - name: Build release archives (make dist)
        run: make dist VERSION=v0.0.0-layout-test
      - name: Assert archive names
        run: |
          cd bin
          for a in \
            kern-linux-amd64.tar.gz kern-linux-arm64.tar.gz \
            kern-darwin-amd64.tar.gz kern-darwin-arm64.tar.gz \
            kern-windows-amd64.zip kern-windows-arm64.zip; do
            test -f "$a" || { echo "missing archive: $a"; exit 1; }
          done
          echo "all release archives present:"
          ls -1 kern-*.tar.gz kern-*.zip
      - name: Assert each archive contains the two binaries
        run: |
          cd bin
          for a in kern-*.tar.gz; do
            for b in kern kern-mcp; do
              tar tzf "$a" | grep -qx "./$b" || { echo "$a is missing ./$b:"; tar tzf "$a"; exit 1; }
            done
            echo "$a OK"
          done
          for a in kern-*.zip; do
            for b in kern.exe kern-mcp.exe; do
              unzip -l "$a" | grep -q " $b$" || { echo "$a is missing $b:"; unzip -l "$a"; exit 1; }
            done
            echo "$a OK"
          done
      - name: SHA256SUMS round-trip
        run: |
          cd bin
          test -s SHA256SUMS || { echo "SHA256SUMS not generated by make dist"; exit 1; }
          sha256sum -c SHA256SUMS
