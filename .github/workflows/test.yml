name: test
on:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/setup-tools

      - name: Vet
        run: go vet ./...
      - name: Format
        run: test -z "$(gofmt -l .)" || { echo "gofmt needed on:"; gofmt -l .; exit 1; }
      - name: Test (with coverage)
        run: go test -short -timeout 10m -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: coverage.out
          fail_ci_if_error: false
      - name: Test (sqlite tags)
        run: go test -tags sqlite ./internal/index/... ./internal/doctor/...
      - name: Test (treesitter tags)
        run: CGO_ENABLED=1 go test -tags treesitter ./internal/index/... ./internal/doctor/...
      - name: Build all binaries
        run: |
          go build -buildvcs=false -o "$RUNNER_TEMP/kern" ./cmd/kern
          go build -buildvcs=false -o "$RUNNER_TEMP/kern-mcp" ./cmd/kern-mcp
          go build -buildvcs=false -o "$RUNNER_TEMP/kern-server" ./cmd/kern-server
      - name: Build all binaries (sqlite tags)
        run: |
          go build -buildvcs=false -tags sqlite -o /dev/null ./cmd/kern
          go build -buildvcs=false -tags sqlite -o /dev/null ./cmd/kern-mcp
          go build -buildvcs=false -tags sqlite -o /dev/null ./cmd/kern-server
      - name: Build all binaries (treesitter tags)
        run: |
          CGO_ENABLED=1 go build -buildvcs=false -tags treesitter -o /dev/null ./cmd/kern
          CGO_ENABLED=1 go build -buildvcs=false -tags treesitter -o /dev/null ./cmd/kern-mcp
          CGO_ENABLED=1 go build -buildvcs=false -tags treesitter -o /dev/null ./cmd/kern-server
      # Race detector over the concurrency-sensitive packages (agent registry /
      # in-flight tool / lock lifecycle races, event bus, blueprint sandbox,
      # loop scheduler, symbol index, project store, process groups). Scoped
      # to keep the full -race ./... suite from slowing CI. The -timeout is
      # sized for the race run (roughly 4x slower): internal/app alone is
      # ~3min without -race and exceeds the default 10m cap under
      # instrumentation, and the index suite adds ~4min under -race, so the
      # step gets a 20m budget. This only adds the -race flag — test
      # parallelism is unchanged, so netns tests (which rely on t.Setenv and
      # must stay serial) are unaffected.
      - name: Test (race detector)
        run: go test -short -race -timeout 20m ./internal/governance/... ./internal/mcp/... ./internal/app/... ./internal/web/... ./internal/eventbus/... ./internal/blueprint/sandbox/... ./internal/loop/... ./internal/index/... ./internal/project/... ./internal/processgroup/...
      - name: MCP catalog parity
        run: go test ./internal/setup/ -run TestPluginMatchesMCPCatalog -count=1
      - name: Architecture doc parity
        run: go test -v ./internal/architecture/ -run TestArchitectureDocParity -count=1
      - name: CLI command usage and parity contract
        run: go test ./cmd/kern/ -run 'TestEveryCommandHasUsage|TestMCPToolsReachableFromCLI' -count=1

  # Locks the release artifact layout: `make dist` (the same flow the release
  # workflow uses) must produce exactly the archives release.yml uploads, each
  # containing the three binaries, plus a SHA256SUMS that round-trips through
  # sha256sum -c. Guards against silent layout drift (renamed archives or
  # binaries) breaking install.sh and the release pipeline.
  release-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release archives (make dist)
        run: make dist VERSION=v0.0.0-layout-test
      - name: Assert archive names
        run: |
          cd bin
          for a in \
            kern-linux-amd64.tar.gz kern-linux-arm64.tar.gz \
            kern-darwin-amd64.tar.gz kern-darwin-arm64.tar.gz \
            kern-windows-amd64.zip kern-windows-arm64.zip; do
            test -f "$a" || { echo "missing archive: $a"; exit 1; }
          done
          echo "all release archives present:"
          ls -1 kern-*.tar.gz kern-*.zip
      - name: Assert each archive contains the three binaries
        run: |
          cd bin
          for a in kern-*.tar.gz; do
            for b in kern kern-mcp kern-server; do
              tar tzf "$a" | grep -qx "./$b" || { echo "$a is missing ./$b:"; tar tzf "$a"; exit 1; }
            done
            echo "$a OK"
          done
          for a in kern-*.zip; do
            for b in kern.exe kern-mcp.exe kern-server.exe; do
              unzip -l "$a" | grep -q " $b$" || { echo "$a is missing $b:"; unzip -l "$a"; exit 1; }
            done
            echo "$a OK"
          done
      - name: SHA256SUMS round-trip
        run: |
          cd bin
          test -s SHA256SUMS || { echo "SHA256SUMS not generated by make dist"; exit 1; }
          sha256sum -c SHA256SUMS
